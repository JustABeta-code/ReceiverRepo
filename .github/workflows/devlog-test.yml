# Test of the Portfolio devlog workflow: reads TestRepo's public history and adds
# a line to FileToModify.txt for every commit marked with a "Devlog: <title>"
# trailer (see .github/scripts/update_file.py).
name: Devlog test

on:
  schedule:
    - cron: "7,37 * * * *"  # twice an hour (UTC) for the test; the Portfolio runs every 3 hours
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # to commit the text file to this repo

concurrency:
  group: devlog-test         # never two runs at once
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/JustABeta-code/TestRepo.git
  TARGET_FILE: FileToModify.txt

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Clone the source repo's history (commits only, no files)
        run: git clone --filter=tree:0 --no-checkout --single-branch "$SOURCE_REPO" "$RUNNER_TEMP/source"

      - name: Add new entries
        shell: bash  # runs with pipefail, so the step still fails if the script fails
        env:
          GH_TOKEN: ${{ github.token }}  # authenticates the request for push times
        run: python3 .github/scripts/update_file.py "$RUNNER_TEMP/source" "$TARGET_FILE" | tee "$RUNNER_TEMP/added.txt"

      - name: Commit, push and notify if anything changed
        env:
          GH_TOKEN: ${{ github.token }}  # lets gh comment on the new commit
        run: |
          if [ -z "$(git status --porcelain -- "$TARGET_FILE")" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_FILE"
          git commit -m "Update $TARGET_FILE from TestRepo"
          git push

          # Mention the repo owner in a comment on the new commit. GitHub emails
          # mentions, so an email arrives only when an entry was actually added.
          {
            echo "@$GITHUB_REPOSITORY_OWNER new entries:"
            grep '^Added: ' "$RUNNER_TEMP/added.txt" | sed 's/^Added: /- /'
          } > "$RUNNER_TEMP/comment.md"
          gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent
